    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Centralized Theme Runtime Loader (UI Portal Integration Guide - Zero Local Theme Files) -->
    <script>
      (function () {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        var server = isLocal ? 'http://localhost:7000' : 'https://ui-theme.pydah.edu.in';
        var poll = isLocal ? '10' : '30';
        document.write('<script src="' + server + '/themes/theme-loader.js" data-theme-server="' + server + '" data-poll-interval="' + poll + '"><\/script>');
      })();
    </script>
    <!-- Fallback if central server is offline & no local server is running -->
    <noscript>
      <link rel="stylesheet" href="https://ui-theme.pydah.edu.in/themes/theme.css" />
    </noscript>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Campo - Staff Recruitment System</title>
