# ==============================================================================
# Nginx Configuration for SRS (Staff Recruitment System)
#
# Domains:
#   - Frontend: srs.pydah.edu.in         -> /var/www/srs
#   - Backend:  srs-backend.pydah.edu.in -> Reverse proxy to Node.js (port 5001)
#
# Server Location:
#   Copy this file to /etc/nginx/conf.d/srs.conf
#   (or /etc/nginx/sites-available/srs.conf and symlink to sites-enabled)
#
# SSL Certificate Setup:
#   sudo certbot --nginx -d srs.pydah.edu.in -d srs-backend.pydah.edu.in
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. FRONTEND: srs.pydah.edu.in
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name srs.pydah.edu.in;

    root /var/www/srs;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client-side routing for Single Page Application (React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for /api requests to Node.js backend
    location /api {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Max file upload size (resumes, documents)
        client_max_body_size 50M;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Cache static assets (images, css, js, fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Deny access to hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ------------------------------------------------------------------------------
# 2. BACKEND API: srs-backend.pydah.edu.in
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name srs-backend.pydah.edu.in;

    # Max body size for uploads (resumes, certificates, photos)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for realtime push/events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for heavy operations (PDF/Excel generation, drive uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
